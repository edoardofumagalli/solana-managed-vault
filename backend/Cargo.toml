[package]
name = "managed-vault-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
anchor-lang = "0.32.1"
anchor_managed_vault = { path = "../anchor_managed_vault/programs/anchor_managed_vault", features = ["no-entrypoint"] }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bincode = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
solana-client = "2.3.0"
solana-sdk = "2.3.0"
solana-transaction-status-client-types = "2.3.0"
spl-associated-token-account = "7.0.0"
spl-token = "8.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
